<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one centered study column — status strip, filter chips, one card at a time, rating bar */
:root{
  --bg:#eef0f2; --surface:#ffffff; --fg:#1d2329; --muted:#5d6873; --line:#d5dade;
  --accent:#e8700a; --accent-ink:#1a1206; --good:#2f7d4f; --again:#b8432f; --soft:#f6f7f8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191d; --surface:#1f252b; --fg:#e7eaed; --muted:#9aa5b0; --line:#323b43;
  --accent:#f08a2c; --accent-ink:#1a1206; --good:#5fb683; --again:#e07a64; --soft:#262d34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191d; --surface:#1f252b; --fg:#e7eaed; --muted:#9aa5b0; --line:#323b43;
  --accent:#f08a2c; --accent-ink:#1a1206; --good:#5fb683; --again:#e07a64; --soft:#262d34; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.plate{display:grid;grid-template-rows:1fr 1fr;width:46px;height:34px;background:var(--accent);border:2px solid #111;border-radius:3px;
  font:700 12px/1 var(--display);color:#111;text-align:center;letter-spacing:.04em}
.plate span{display:flex;align-items:center;justify-content:center}
.plate span+span{border-top:2px solid #111}
h1{font:700 26px/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.stats{display:flex;gap:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 15px/1 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
label.tog{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kind{font-weight:700;color:var(--accent)}
.q{font-size:20px;line-height:1.4;font-weight:600;margin:0}
.ans{border-top:2px solid var(--accent);padding-top:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ans .a{margin:0;overflow-wrap:anywhere}
.ans .t{margin:0;background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--fg)}
.ans .t::before{content:"Prüfer fragt nach";display:block;font:700 13px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font:700 18px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:16px 12px;border-radius:12px;border:0;cursor:pointer}
.btn.reveal{background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);color:#fff}
.btn.again{background:var(--again);color:#fff}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);flex:0 0 auto}
.btn:focus-visible,.chip:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.done{text-align:center;align-items:center}
.done h2{font:700 30px/1.1 var(--display);margin:0}
.big{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);text-align:center}
@media (max-width:420px){.q{font-size:18px}.stats{gap:10px}}
@media (prefers-reduced-motion:no-preference){.ans{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<script>
const Q=[{"p": 1, "s": "Steuern und Bilanz", "k": "o", "q": "Wie wird das zu versteuernde Einkommen ermittelt? Nenne die sieben Einkunftsarten.", "a": "Die Einkünfte aus den <b>unterschiedlichen Einkunftsarten<\/b> werden zusammengerechnet; für die einzelnen Steuerarten gelten unterschiedliche Freigrenzen und Freibeträge.<br/>1. Land- und Forstwirtschaft (§§ 13–14a EStG) · 2. <b>Gewerbebetrieb (§§ 15–17 EStG)<\/b> · 3. selbstständige Arbeit (§ 18) · 4. nichtselbstständige Arbeit (§§ 19–19a, z. B. Gehalt von Arbeitnehmern) · 5. Kapitalvermögen (§ 20) · 6. Vermietung und Verpachtung (§ 21) · 7. sonstige Einkünfte (§§ 22–23).<br/><i>Merkhilfe: 3 Gewinneinkünfte (LuF, Gewerbe, Selbstständig) + 4 Überschusseinkünfte.<\/i>", "t": "Unter welche Einkunftsart fällt ein Transportunternehmer? → Gewerbebetrieb (§ 15 EStG). <i>Achtung Folie: Dort steht, unternehmerische Einkünfte aus Personengesellschaften fallen unter § 18. Gesetzlich gehört eine gewerbliche Personengesellschaft (z. B. OHG, KG) zu § 15 Gewerbebetrieb; § 18 gilt für Freiberufler wie Ärzte oder Steuerberater.<\/i>", "id": 0}, {"p": 1, "s": "Steuern und Bilanz", "k": "o", "q": "Worauf wird die Einkommensteuer bei Unternehmern berechnet, und welche Rolle spielen Betriebsausgaben?", "a": "Auf das <b>zu versteuernde Einkommen<\/b>. Betriebsausgaben <b>mindern den Gewinn<\/b> und damit das zu versteuernde Einkommen – also auch die Steuer.", "t": "", "id": 1}, {"p": 1, "s": "Steuern und Bilanz", "k": "o", "q": "Nenne mindestens sechs abzugsfähige Betriebsausgaben.", "a": "Personalkosten (Gehalt, Lohn), Abschreibungen, Einkäufe von Waren und Dienstleistungen, Aufwendungen für geringwertige Wirtschaftsgüter, Mietkosten, abziehbare Vorsteuer, abgeführte Umsatzsteuer, Pkw-Kosten.", "t": "Für Spediteure typisch: Diesel, Maut, Reparaturen, Versicherungen, Kfz-Steuer. <i>(Vorsteuer und abgeführte Umsatzsteuer sind nur bei der Einnahmen-Überschuss-Rechnung Betriebsausgaben; bei bilanzierenden Unternehmen sind sie „durchlaufende Posten“.)<\/i>", "id": 2}, {"p": 1, "s": "Steuern und Bilanz", "k": "o", "q": "Beschreibe den Aufbau einer Bilanz. Was steht auf der Aktiv-, was auf der Passivseite?", "a": "<b>Aktiva (Mittelverwendung):<\/b> Anlagevermögen (Fuhrpark, Maschinen, Gebäude/Grundstücke, Büroausstattung) und Umlaufvermögen (Bankguthaben, Kasse, Vorräte, Forderungen, Besitzwechsel).<br/><b>Passiva (Mittelherkunft):<\/b> Eigenkapital und Fremdkapital (Darlehen, Hypotheken, Grundschuld, Kontokorrentkredit, Lieferantenverbindlichkeiten).<br/>Beide Seiten ergeben die gleiche <b>Bilanzsumme<\/b>.", "t": "Worin unterscheiden sich Anlage- und Umlaufvermögen? → AV dient dem Betrieb dauerhaft (z. B. Lkw), UV ist kurzfristig und verändert sich ständig (z. B. Kasse, Forderungen).", "id": 3}, {"p": 1, "s": "Steuern und Bilanz", "k": "o", "q": "Wie berechnet man das Eigenkapital?", "a": "<b>(Anlagevermögen + Umlaufvermögen) − Fremdkapital = Eigenkapital<\/b>. Das Eigenkapital ist also das Vermögen, das nach Abzug aller Schulden übrig bleibt.", "t": "", "id": 4}, {"p": 1, "s": "Steuern und Bilanz", "k": "c", "q": "Ein Unternehmer hat: Fuhrpark 250.000 €, Gebäude 120.000 €, Büroausstattung 30.000 €, Bank 40.000 €, Kasse 5.000 €, Forderungen 45.000 €, Vorräte 10.000 €. Darlehen 220.000 €, Kontokorrentkredit 60.000 €, Lieferantenverbindlichkeiten 40.000 €. Wie hoch sind Anlagevermögen, Umlaufvermögen, Fremdkapital, Eigenkapital und Bilanzsumme?", "a": "AV = 250.000 + 120.000 + 30.000 = <b>400.000 €<\/b><br/>UV = 40.000 + 5.000 + 45.000 + 10.000 = <b>100.000 €<\/b><br/>FK = 220.000 + 60.000 + 40.000 = <b>320.000 €<\/b><br/>EK = (400.000 + 100.000) − 320.000 = <b>180.000 €<\/b><br/>Bilanzsumme = <b>500.000 €<\/b> (auf beiden Seiten)", "t": "", "id": 5}, {"p": 1, "s": "Steuern und Bilanz", "k": "o", "q": "Ordne zu – Aktiva oder Passiva, und welcher Posten genau? Lkw · Kontokorrentkredit · Forderung an einen Kunden · Grundschuld · Besitzwechsel · offene Rechnung der Werkstatt", "a": "Lkw → Aktiva, Anlagevermögen (Fuhrpark) · Kontokorrentkredit → Passiva, Fremdkapital · Forderung → Aktiva, Umlaufvermögen · Grundschuld → Passiva, Fremdkapital · Besitzwechsel → Aktiva, Umlaufvermögen · offene Werkstattrechnung → Passiva, Fremdkapital (Lieferantenverbindlichkeit)", "t": "", "id": 6}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Wie lang darf die tägliche Arbeitszeit nach § 3 Arbeitszeitgesetz sein, und welche Wochenarbeitszeit ergibt sich daraus?", "a": "Maximal <b>8 Stunden<\/b> täglich. Da der <b>Samstag als Werktag<\/b> zählt (6 Werktage), liegt dem Gesetz die <b>48-Stunden-Woche<\/b> zugrunde.", "t": "", "id": 7}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Unter welchen Voraussetzungen darf die tägliche Arbeitszeit verlängert werden?", "a": "Auf bis zu <b>10 Stunden täglich<\/b>, wenn innerhalb von <b>24 Wochen oder 6 Monaten<\/b> im Durchschnitt 8 Stunden werktäglich nicht überschritten werden. Per <b>Tarifvertrag<\/b> kann der Ausgleichszeitraum auf bis zu <b>12 Monate<\/b> verlängert werden.", "t": "", "id": 8}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "f", "q": "Ein Disponent arbeitet wegen einer Großbaustelle drei Wochen lang Montag bis Samstag je 10 Stunden. Ist das erlaubt?", "a": "Ja, grundsätzlich. 10 Stunden sind die zulässige Obergrenze. Voraussetzung ist, dass die Mehrstunden innerhalb von 24 Wochen bzw. 6 Monaten ausgeglichen werden, sodass im Schnitt nicht mehr als 8 Stunden pro Werktag (48 Std./Woche) gearbeitet werden – z. B. durch kürzere Tage oder freie Tage danach.", "t": "", "id": 9}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Was ist laut Folie „Arbeitszeit“, und welche Tätigkeiten eines Fahrers zählen dazu?", "a": "Die Zeitspanne zwischen Arbeitsbeginn und Arbeitsende <b>ohne Ruhepausen und Ruhezeiten<\/b>. Der Fahrer übt seine Tätigkeit aus oder muss sich am Arbeitsplatz bereithalten, wobei der Beginn der Tätigkeit nicht im Voraus bekannt ist.<br/>Dazu zählen: <b>Fahren<\/b>, <b>Be- und Entladen<\/b>, <b>Reinigung und Wartung<\/b> des Fahrzeugs, <b>Erledigung gesetzlicher/behördlicher Formalitäten<\/b>, <b>Überwachung des Be- und Entladens<\/b>, <b>Warten auf das Be- und Entladen, wenn die Wartezeit nicht bekannt ist<\/b>.", "t": "", "id": 10}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "f", "q": "Ein Fahrer wartet an der Rampe. Ihm wird gesagt: „Sie werden in genau 2 Stunden entladen.“ Ist das Arbeitszeit?", "a": "Nein – nach der Folie zählt Warten nur dann als Arbeitszeit, wenn die <b>Dauer der Wartezeit nicht im Voraus bekannt<\/b> ist. Ist sie bekannt, kann sie z. B. als Bereitschaftszeit oder Pause gelten.", "t": "Und wenn niemand sagt, wie lange es dauert? → Dann ist es Arbeitszeit.", "id": 11}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Was regelt Art. 6 Abs. 2 der VO (EG) Nr. 561/2006 zur Lenkzeit, und welche Höchstarbeitszeit gilt pro Woche?", "a": "Die <b>wöchentliche Lenkzeit darf 56 Stunden<\/b> nicht überschreiten und darf nicht dazu führen, dass die wöchentliche Höchstarbeitszeit nach der Richtlinie 2002/15/EG bzw. <b>§ 21a ArbZG<\/b> überschritten wird. Grundsätzlich ist eine <b>Höchstarbeitszeit von 48 Stunden pro Woche<\/b> zulässig.", "t": "<i>Zur Info: Nach § 21a ArbZG darf die Wochenarbeitszeit von Fahrern auf bis zu 60 Stunden verlängert werden, wenn innerhalb von 4 Kalendermonaten bzw. 16 Wochen im Durchschnitt 48 Stunden nicht überschritten werden.<\/i>", "id": 12}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Erkläre die Begriffe Lenkdauer, Lenkzeit und Tageslenkzeit.", "a": "<b>Lenkdauer:<\/b> die Zeit zwischen einer Ruhezeit oder Fahrtunterbrechung und der nächsten Fahrtunterbrechung oder Ruhezeit; sie kann unterbrochen oder ununterbrochen sein.<br/><b>Lenkzeit:<\/b> die reine Lenktätigkeit, voll- oder halbautomatisch, analog oder digital aufgezeichnet.<br/><b>Tageslenkzeit:<\/b> die summierte Gesamtlenkzeit zwischen zwei täglichen oder einer täglichen und einer wöchentlichen Ruhezeit.", "t": "", "id": 13}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Nenne die vier Höchstwerte für die Lenkzeit.", "a": "Tageslenkzeit max. <b>9 Std.<\/b> · höchstens <b>zweimal pro Woche 10 Std.<\/b> · Wochenlenkzeit max. <b>56 Std.<\/b> · in zwei aufeinanderfolgenden Wochen max. <b>90 Std.<\/b>", "t": "", "id": 14}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "c", "q": "Ein Fahrer ist in Woche 1 insgesamt 56 Stunden gefahren. Wie viele Stunden darf er in Woche 2 höchstens fahren? Wie kommt man in Woche 1 überhaupt auf 56 Stunden?", "a": "Woche 2: 90 − 56 = <b>34 Stunden<\/b>.<br/>56 Stunden in Woche 1 z. B. so: 2 Tage à 10 Std. + 4 Tage à 9 Std. = 20 + 36 = 56 Std. (an 6 Tagen).", "t": "", "id": 15}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "c", "q": "Ein Fahrer hat diese Woche Mo 10 h, Di 9 h, Mi 10 h, Do 9 h gelenkt. Darf er am Freitag 10 Stunden fahren?", "a": "<b>Nein.<\/b> Die 10-Stunden-Verlängerung darf nur zweimal pro Woche genutzt werden – das ist mit Montag und Mittwoch bereits geschehen. Am Freitag sind höchstens <b>9 Stunden<\/b> erlaubt (bisher 38 Std. + 9 = 47 Std., also unter 56).", "t": "", "id": 16}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Für wen gilt das Jugendarbeitsschutzgesetz, und wer ist „Jugendlicher“?", "a": "Für die Beschäftigung von Personen, die <b>noch nicht 18 Jahre<\/b> alt sind – in Berufsausbildung oder ähnlichen Ausbildungsverhältnissen. <b>Jugendlicher<\/b> ist, wer <b>15, aber noch nicht 18 Jahre<\/b> alt ist.", "t": "Und unter 15? → Dann gilt die Person als Kind; Kinderarbeit ist grundsätzlich verboten.", "id": 17}, {"p": 1, "s": "Arbeitszeit und Jugendarbeitsschutz", "k": "o", "q": "Nenne möglichst viele wichtige Regelungen des Jugendarbeitsschutzgesetzes.", "a": "§ 8 Arbeitszeit · § 9 Freistellung für die Berufsschule · § 10 Freistellung für Prüfungen · § 15 Fünf-Tage-Woche · § 16 Samstagsruhe · § 17 Sonntagsruhe · § 19 Urlaub · §§ 22–27 Beschäftigungsverbote · §§ 32–46 Erstuntersuchung (ärztlich)", "t": "<i>Zur Info aus dem Gesetz: höchstens 8 Std. täglich und 40 Std. wöchentlich (§ 8).<\/i>", "id": 18}, {"p": 1, "s": "Sicherheitsprüfung", "k": "o", "q": "Was ist die Sicherheitsprüfung (SP), und welche Baugruppen werden geprüft?", "a": "Eine <b>Sicht-, Wirkungs- und Funktionsprüfung<\/b> bei Nutzkraftwagen. Geprüft werden: <b>Fahrgestell, Fahrwerk, Verbindungseinrichtung · Lenkung · Reifen, Räder · Bremsanlage · Schließkräfte an fremdkraftbetätigten Türen<\/b>.", "t": "Wo wird die SP dokumentiert? → Im Prüfbuch.", "id": 19}, {"p": 1, "s": "Sicherheitsprüfung", "k": "o", "q": "Welche Fristen gelten für die Sicherheitsprüfung bei Lkw und Anhängern?", "a": "Die SP findet zwischen den Hauptuntersuchungen statt.<br/><b>Lkw über 7,5 t bis 12 t:<\/b> erste SP 42 Monate nach Erstzulassung, danach immer 6 Monate nach der letzten HU.<br/><b>Lkw über 12 t:<\/b> erste SP 30 Monate nach Erstzulassung, danach immer 6 Monate nach der letzten HU.<br/><b>Anhänger über 10 t:<\/b> erste SP 2,5 Jahre nach Erstzulassung, danach jährlich (6 Monate nach der HU).", "t": "", "id": 20}, {"p": 1, "s": "Sicherheitsprüfung", "k": "c", "q": "Eine Sattelzugmaschine mit 18 t zulässigem Gesamtgewicht wurde im März 2024 erstmals zugelassen. Wann ist die erste Sicherheitsprüfung fällig?", "a": "Über 12 t → 30 Monate nach Erstzulassung: März 2024 + 30 Monate = <b>September 2026<\/b>. Danach jeweils 6 Monate nach der letzten HU.", "t": "", "id": 21}, {"p": 1, "s": "Sicherheitsprüfung", "k": "c", "q": "Ein Lkw mit 11,99 t wurde im Mai 2023 zugelassen. Wann ist die erste SP fällig? Die nächste HU findet im Mai 2027 statt – wann folgt die nächste SP?", "a": "Über 7,5 t bis 12 t → 42 Monate: Mai 2023 + 42 Monate = <b>November 2026<\/b>. Nächste SP 6 Monate nach der HU im Mai 2027 = <b>November 2027<\/b>.", "t": "", "id": 22}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Definiere Marktforschung. (Beide Definitionen von der Folie)", "a": "<b>Definition 1:<\/b> Beschaffung notwendiger Informationen über z. B. Mitbewerber, allgemeine Marktdaten (Kaufkraft, Preise, Lohnniveau) oder darüber, wie Waren/Dienstleistungen beim Kunden ankommen und wie der zukünftige Bedarf aussehen wird.<br/><b>Definition 2:<\/b> Erhebung, Aufbereitung und Auswertung von Daten nach wissenschaftlich anerkannten Methoden. Die Ergebnisse sind oft die Basis für unternehmerische Entscheidungen; Ziel ist der Gewinn entscheidungsrelevanter Erkenntnisse zu einem konkreten Untersuchungsgegenstand.", "t": "", "id": 23}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Was ist der Unterschied zwischen Primär- und Sekundärforschung? Nenne jeweils Beispiele.", "a": "<b>Primärforschung:<\/b> eigene, neue Daten erheben – Beobachtungen, Experimente, Umfragen.<br/><b>Sekundärforschung:<\/b> vorhandene Daten auswerten – amtliche Statistiken des Statistischen Bundesamts, Informationen der IHK, Verbandsberichte und Nachrichten von Berufsverbänden, Institutionen mit branchenspezifischen Informationen, Fachzeitschriften, Wirtschaftsteile überregionaler Medien.", "t": "Ein Spediteur ruft 50 Kunden an und fragt nach ihrer Zufriedenheit – was ist das? → Primärforschung (Umfrage).", "id": 24}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "In welche vier Bereiche lässt sich die Marktanalyse im Transportgewerbe unterteilen? Wozu gehört die Marktanalyse?", "a": "Analyse des <b>Verkehrsmarktes<\/b>, der <b>Mitbewerber<\/b>, des <b>eigenen Unternehmens<\/b> und des <b>Kunden<\/b>. Die Marktanalyse gehört zum Oberbegriff <b>Marktforschung<\/b>; sie zielt auf die Bestimmung gewisser Faktoren <b>zu einem bestimmten Zeitpunkt<\/b> (Momentaufnahme).", "t": "", "id": 25}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Was wird bei der Analyse des Verkehrsmarktes untersucht?", "a": "<b>Transportaufkommen und -ströme<\/b> in den verschiedenen Verkehrsverbindungen sowie das <b>Verhalten der konkurrierenden Verkehrsträger<\/b> untereinander (Straße, Schiene, Binnenschiff, Luftfracht).", "t": "", "id": 26}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Welche Punkte betrachtet man bei der Analyse des eigenen Unternehmens? Nenne mindestens acht.", "a": "Standort · Lagerhaltung · eigene Werkstatt (Kostendeckung?) · Autobahnanschlüsse/Verkehrsanbindung · Fuhrpark (Anzahl, Art, Alter) · Umschlagseinrichtungen · Laderaumauslastung · Standzeiten, Leerfahrten · ergänzende Serviceleistungen · Transportberatung · Personal und dessen Auslastung · interne und externe Weiter- und Fortbildung · Betriebstreue der Mitarbeiter", "t": "", "id": 27}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Welche Punkte sollten bei der Analyse eines Kunden grundsätzlich erfasst werden?", "a": "Wer ist „mein“ <b>Ansprechpartner<\/b> (direkte Telefonnummer, evtl. Geburtsdatum, Interessen) · <b>Art der Güter<\/b> (sperrig, Gefahrgut, Lebensmittel, Stückgut) · <b>Lade- und Entladezeiten, Pausenregelung<\/b> · Besonderheiten wie Fußgängerzonen, einzuplanende Standzeiten, Schadenshäufigkeit durch mangelhafte Verpackung · <b>Standort<\/b>, Entfernung zu anderen Kunden (Rücklademöglichkeit), Mitbewerber, Zustand des Straßennetzes · <b>Zahlungsmoral<\/b>, Geldeingangsdauer", "t": "Warum ist die Entfernung zu anderen Kunden wichtig? → Wegen der Rücklademöglichkeit: Leerfahrten vermeiden.", "id": 28}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Welche zwei Gruppen stehen sich im Marketing gegenüber, und welche vier Erfolgsfaktoren beeinflussen den Unternehmenserfolg?", "a": "<b>Unternehmer<\/b> und <b>Kunde<\/b>. Erfolgsfaktoren:<br/>1. <b>Echte Marktorientierung<\/b> – Kundenbedürfnisse ermitteln und befriedigen<br/>2. <b>Hochsensible Wahrnehmung der Marktreaktion<\/b> – Veränderungen des Marktes ständig beobachten und auswerten<br/>3. <b>Größtmögliche organisatorische Flexibilität<\/b> – keine überzogen starre Struktur, Organisation auf Veränderungen im Umfeld abstimmen<br/>4. <b>Optimale Professionalität im Marketing<\/b>", "t": "", "id": 29}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Erkläre Verbundenheits- und Gebundenheitsstrategie und nenne jeweils ein Beispiel.", "a": "<b>Verbundenheitsstrategie:<\/b> <b>emotionale Bindung<\/b> – der Kunde fühlt sich dem Anbieter verbunden, ist loyal und denkt nicht an einen Wechsel, weil er sich auf ihn verlassen kann und keine negativen Erfahrungen gemacht hat. Beispiel: immer pünktlich, fester Ansprechpartner.<br/><b>Gebundenheitsstrategie (faktische Gebundenheit):<\/b> systematisch werden Hindernisse geschaffen, die einen Wechsel erschweren oder unmöglich machen, z. B. durch <b>Vertragsgestaltung<\/b> (lange Laufzeit, hohe Ausstiegskosten).", "t": "", "id": 30}, {"p": 1, "s": "Marketing und Marktforschung", "k": "o", "q": "Nenne die vier Instrumente des Marketing-Mix und erkläre sie mit Beispielen aus dem Transportgewerbe.", "a": "<b>Produktpolitik:<\/b> Gestaltung des Produkts, Qualität, Service, Technologie, Zuverlässigkeit, Sortimentsgestaltung (Lager, Kühlregallager, Werkstatt).<br/><b>Preispolitik:<\/b> kostenorientiert, mitbewerberorientiert, ABC-Analyse – sie muss herausfinden, welchen Preis Kunden für die Produktmerkmale zu zahlen bereit sind.<br/><b>Kommunikationspolitik:<\/b> Werbung, Öffentlichkeitsarbeit, Flyer, Internet, verschiedene Medien (Print, Film).<br/><b>Distributions-/Vertriebspolitik:<\/b> wie das Angebot vom Anbieter zum Kunden kommt (Vertriebswege).", "t": "", "id": 31}, {"p": 1, "s": "Marketing und Marktforschung", "k": "f", "q": "Ein Spediteur richtet ein Kühllager ein, schaltet Werbung auf LinkedIn und senkt die Preise für Stammkunden. Welche Instrumente des Marketing-Mix nutzt er?", "a": "Kühllager → <b>Produktpolitik<\/b> (Sortimentsgestaltung) · LinkedIn-Werbung → <b>Kommunikationspolitik<\/b> · Preissenkung für Stammkunden → <b>Preispolitik<\/b>.", "t": "", "id": 32}, {"p": 2, "s": "Marketing: Vertrieb und Kontrolle", "k": "o", "q": "Worum geht es bei der Distributionspolitik, und wie nennt man sie heute?", "a": "Um die <b>effiziente Gestaltung aller Aktivitäten auf dem Weg eines Produkts oder einer Dienstleistung vom Anbieter zum Kunden bzw. Anwender<\/b>. Nach zeitgemäßem Marketingverständnis spricht man nicht mehr von Distributions-, sondern von <b>Vertriebspolitik<\/b>.", "t": "", "id": 33}, {"p": 2, "s": "Marketing: Vertrieb und Kontrolle", "k": "o", "q": "Was ist Marketingkontrolle, und welche Kontrollbereiche unterscheidet man?", "a": "Die <b>Überprüfung des Erfolgs<\/b> beim Einsatz der Marketinginstrumente – Produkt-, Preis-, Vertriebs- und Kommunikationspolitik. Sie ist eine <b>Teilfunktion des Marketingcontrollings<\/b>.<br/>Kontrollbereiche: <b>Profitabilitätskontrolle<\/b> · <b>Leistungskontrolle<\/b> (Umsatzentwicklung, Entwicklung des Marktanteils) · <b>Strategiekontrolle<\/b>.", "t": "Woran erkennen Sie, ob Ihre Werbekampagne erfolgreich war? → Leistungskontrolle: Ist der Umsatz gestiegen, hat sich der Marktanteil verbessert?", "id": 34}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche gesetzlichen Bestimmungen gelten für innerstaatliche und grenzüberschreitende Gefahrguttransporte auf der Straße?", "a": "<b>GGVSEB<\/b> – Gefahrgutverordnung Straße, Eisenbahn und Binnenschifffahrt (national) und <b>ADR<\/b> – Europäisches Übereinkommen über die internationale Beförderung gefährlicher Güter auf der Straße.", "t": "", "id": 35}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Was bedeutet ADR? Nenne Herkunft und Eckdaten.", "a": "Französische Abkürzung: <b>„Accord européen relatif au transport international des marchandises Dangereuses par Route“<\/b>. Beschlossen am <b>30.09.1957 in Genf<\/b> unter Leitung der <b>UNECE<\/b>, in Kraft seit <b>29.01.1968<\/b>. Alle EU-Staaten sind Unterzeichner; über eine EU-Verordnung rechtsgültig. Das ADR wird <b>alle zwei Jahre<\/b> an neue technische und juristische Erkenntnisse angepasst.", "t": "", "id": 36}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche weiteren Gesetze müssen beim Gefahrguttransport eventuell beachtet werden? Nenne fünf.", "a": "Wasserhaushaltsgesetz · Strahlenschutzverordnung · Atomgesetz · Straßenverkehrsordnung · Arbeitsschutzgesetz · Sozialvorschriften · Kreislaufwirtschafts-/Abfallgesetz · Sprengstoffgesetz · Chemikaliengesetz (Gefahrstoffverordnung)", "t": "", "id": 37}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche Arten der Kennzeichnung mit Warntafeln gibt es?", "a": "<b>Stückguttransporte:<\/b> neutrale orange Warntafel (ohne Ziffern) vorne und hinten an der Beförderungseinheit.<br/><b>Tankfahrzeug mit Einproduktentank:<\/b> vorne und hinten <b>bezifferte<\/b> Warntafeln.<br/><b>Tankfahrzeug mit Mehrproduktentank<\/b> (jede Kammer anderes Gefahrgut): vorne und hinten <b>neutrale<\/b> orange Warntafeln, <b>seitlich<\/b> in Höhe jeder Tankkammer <b>bezifferte<\/b> Warntafeln.", "t": "", "id": 38}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche Bedeutung haben die Ziffern auf der Warntafel?", "a": "<b>Oben:<\/b> Nummer zur Kennzeichnung der Gefahr (Gefahrnummer). Die <b>erste Ziffer<\/b> ist die <b>Hauptgefahr<\/b>, weitere Ziffern sind Nebengefahren. Eine <b>Verdopplung<\/b> der Ziffer bedeutet eine <b>Erhöhung der Gefahr<\/b>.<br/><b>Unten:<\/b> die <b>Stoffnummer bzw. UN-Nummer<\/b>.", "t": "Was ist der Unterschied zwischen 30 und 33? → Beide: entzündbarer flüssiger Stoff (Ziffer 3); bei 33 ist die Entzündbarkeit erhöht (verdoppelt). <i>Zur Info: 1202 = Diesel/Heizöl, 1203 = Benzin; eine 0 an zweiter Stelle heißt „keine Nebengefahr“; ein X vor der Gefahrnummer heißt „reagiert gefährlich mit Wasser“.<\/i>", "id": 39}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche Begleitpapiere gibt es beim Gefahrguttransport? Nenne die wesentlichen.", "a": "<b>ADR-Bescheinigung<\/b> (Schulungsbescheinigung des Fahrers) · <b>Schriftliche Weisungen<\/b> (Unfallmerkblatt) · <b>Beförderungspapier<\/b> · Fahrwegbestimmung · Containerpackzertifikat · Zulassungsbescheinigung für die Beförderungseinheit · behördliche Sondergenehmigungen · Pass/Ausweis", "t": "", "id": 40}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche Angaben muss ein Beförderungspapier enthalten? Nenne mindestens vier.", "a": "Name und Anschrift von Absender und Empfänger · <b>UN-Nummer<\/b> (mit „UN“ davor) · <b>Stoffname<\/b> gemäß ADR-Stoffaufzählung · Gefahrzettelmusternummer · Verpackungsgruppe (VG) · Tunnelbeschränkungscode · <b>Anzahl und Beschreibung der Versandstücke<\/b> · <b>Gesamtmenge je Gut<\/b> (mit UN-Nummer, offizieller Benennung, evtl. VG) · evtl. Hinweis auf Sondervereinbarungen", "t": "", "id": 41}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Was muss der Fahrer vor Fahrtantritt prüfen? Nenne drei Punkte.", "a": "Begleitpapiere auf <b>Vollzähligkeit<\/b> prüfen · <b>Schriftliche Weisungen<\/b> lesen · <b>Vorhandensein und Funktionstüchtigkeit der Ausrüstung<\/b> prüfen · <b>Ladung sichern<\/b> · bei Überschreiten der Mengengrenzen <b>Warntafeln<\/b> anbringen", "t": "", "id": 42}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Wer ist beim Gefahrguttransport der Beförderer?", "a": "Das Unternehmen, das den Gefahrguttransport <b>tatsächlich durchführt<\/b> – also der <b>Frachtführer<\/b>.", "t": "", "id": 43}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Welche Aufgaben hat ein Gefahrgutbeauftragter?", "a": "Überwachung der Einhaltung der Gefahrgutvorschriften · Aufzeichnung seiner Überwachungstätigkeit · Anzeigen von Mängeln, die die Sicherheit bei Transport oder Verladen gefährden · Beratung des Unternehmers bei der Umsetzung der Vorschriften · <b>Jahresbericht<\/b> (Art und Menge der Güter, Unfälle, Optimierungsmaßnahmen) · Ausbildung und Unterweisung der Mitarbeiter.<br/>Wer Gefahrgut transportiert, muss <b>mindestens einen Gefahrgutbeauftragten bestellen<\/b>.", "t": "<i>Zur Info: Die Gefahrgutbeauftragtenverordnung kennt Ausnahmen, z. B. für sehr kleine Mengen. Im Zweifel beim Dozenten nachfragen, wie das in der Prüfung erwartet wird.<\/i>", "id": 44}, {"p": 2, "s": "Gefahrgut", "k": "o", "q": "Wie wird man Gefahrgutbeauftragter?", "a": "Durch Besuch einer <b>Schulung<\/b> und Ablegen einer <b>Prüfung vor der IHK<\/b> sowie die <b>schriftliche Bestellung<\/b> durch den Unternehmer.", "t": "", "id": 45}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Ihr Unternehmen hat die Beladung der Fahrzeuge vertraglich übernommen. Sie müssen „die in der Praxis anerkannten Beladungsregeln des Speditions- und Fuhrbetriebs“ beachten. In welcher Empfehlung stehen diese Regeln?", "a": "In der <b>VDI-Richtlinie 2700 „Ladungssicherung auf Straßenfahrzeugen“<\/b>.", "t": "", "id": 46}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Ihr Fahrer verursacht auf der Autobahn einen Auffahrunfall. Er fuhr 70 km/h mit 40 m Abstand zum Vordermann. War der Abstand ausreichend?", "a": "<b>Nein.<\/b> Lkw müssen auf Autobahnen bei mehr als 50 km/h einen <b>Mindestabstand von 50 m<\/b> zum vorausfahrenden Fahrzeug einhalten (§ 4 Abs. 3 StVO, gilt für Lkw über 3,5 t). 40 m sind zu wenig.", "t": "Und bei 45 km/h im Stau? → Dann gilt die 50-m-Pflicht nicht, der Abstand muss aber trotzdem zum Anhalten reichen.", "id": 47}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Ein Transportschaden passiert während eines grenzüberschreitenden Transports nach England. Nach welcher Rechtsgrundlage richtet sich Ihre Haftung?", "a": "Nach der <b>CMR<\/b> (Übereinkommen über den Beförderungsvertrag im internationalen Straßengüterverkehr).", "t": "Und bei einem Transport innerhalb Deutschlands? → Nach dem HGB (Frachtrecht, §§ 407 ff.).", "id": 48}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Ihr Auftraggeber prüft, ob Sie alle Genehmigungen haben. Welche Genehmigung brauchen Sie für Transporte nach England und Italien? Was gilt für Kabotage und Nordirland?", "a": "Die <b>Gemeinschaftslizenz<\/b>. Laut Folie: <b>Kabotage<\/b> in Großbritannien: <b>2 Fahrten<\/b> erlaubt. <b>Nordirland<\/b> wird wie die EU behandelt.", "t": "<i>Zur Info: Innerhalb der EU, also z. B. in Italien, gilt eine andere Kabotageregel: bis zu 3 Fahrten innerhalb von 7 Tagen nach einer grenzüberschreitenden Beförderung, danach 4 Tage Pause in dem Land. Die 2 Fahrten auf der Folie gelten für Großbritannien nach dem Brexit-Abkommen.<\/i>", "id": 49}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Bei der Wartung lassen Sie auch die Ausrüstung prüfen, die auf Ihren Fahrzeugen mitgeführt werden muss. Nennen Sie vier Gegenstände.", "a": "<b>Warnweste<\/b> · <b>Warndreieck<\/b> · <b>Verbandkasten<\/b> · <b>Warnleuchte<\/b> · <b>Unterlegkeil<\/b>", "t": "", "id": 50}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "c", "q": "Sie wollen einem Fahrer kündigen, der seit einem Jahr bei Ihnen beschäftigt ist. Sie schreiben die Kündigung am 29.10. und übergeben sie ihm am 04.11. persönlich. a) Welche gesetzliche Kündigungsfrist gilt? b) Wann endet das Arbeitsverhältnis?", "a": "a) Die <b>Grundkündigungsfrist: 4 Wochen zum 15. oder zum Ende eines Kalendermonats<\/b> (bei unter 2 Jahren Betriebszugehörigkeit).<br/>b) Entscheidend ist der <b>Zugang<\/b> (04.11.), nicht das Datum des Schreibens. 04.11. + 4 Wochen = 02.12. → nächster zulässiger Termin: <b>15.12.<\/b>", "t": "Und wenn Sie die Kündigung erst am 20.11. übergeben? → 20.11. + 4 Wochen = 18.12. → Ende am 31.12.", "id": 51}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Der Fahrer droht mit einer Kündigungsschutzklage. Kann er sich auf das Kündigungsschutzgesetz berufen? Begründe.", "a": "<b>Ja<\/b>, weil das Unternehmen <b>mehr als 10 Vollzeitmitarbeiter<\/b> beschäftigt und der Fahrer <b>länger als sechs Monate<\/b> im Betrieb ist.", "t": "Wie lange hat er für die Klage Zeit? → 3 Wochen nach Zugang der Kündigung.", "id": 52}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "f", "q": "Ein russischer Fahrer mit einer russischen Fahrerlaubnis, die Klasse C entspricht, lebt seit dem 1.1. in Deutschland. Bis wann muss er seinen Führerschein spätestens umschreiben lassen?", "a": "Bis spätestens <b>30.06.<\/b> – eine Fahrerlaubnis aus einem Drittstaat gilt nach Begründung des Wohnsitzes in Deutschland nur noch <b>6 Monate<\/b>.", "t": "", "id": 53}, {"p": 2, "s": "Fallfragen aus der Praxis", "k": "o", "q": "Nenne die wichtigsten Inhalte, die Sie im Arbeitsvertrag mit einem neuen Fahrer regeln müssen.", "a": "<b>Beginn des Arbeitsverhältnisses<\/b> · <b>Art der Tätigkeit/Aufgaben<\/b> · <b>Arbeitsentgelt<\/b> · <b>Arbeitszeit<\/b> · <b>Arbeitsort<\/b>", "t": "Weitere sinnvolle Punkte: Probezeit, Urlaub, Kündigungsfristen, Überstunden. <i>(Das Nachweisgesetz verlangt, dass die wesentlichen Bedingungen schriftlich festgehalten werden.)<\/i>", "id": 54}, {"p": 3, "s": "Disposition, Maut und Auslandstransporte", "k": "c", "q": "Englandtour: Der Fahrer fährt am Samstag um 5 Uhr in England los zum Fährhafen Dover (Ankunft 6 Uhr). Die Überfahrt nach Calais dauert 2 Stunden, um 8 Uhr fährt er in Calais weiter nach Bingen. Um wie viel Uhr muss er spätestens seine Fahrtunterbrechung einlegen, und wie lange muss sie dauern?", "a": "<b>Spätestens um 12:30 Uhr, Dauer 45 Minuten.<\/b><br/>Begründung: Nach höchstens <b>4,5 Stunden Lenkzeit<\/b> ist eine Fahrtunterbrechung von mindestens <b>45 Minuten<\/b> Pflicht. Die 2 Stunden auf der Fähre gelten laut Seminarlösung als Fahrtunterbrechung (mindestens 45 Minuten ohne Lenken). Damit beginnt die 4,5-Stunden-Rechnung ab 8 Uhr in Calais neu: 8:00 + 4:30 = <b>12:30 Uhr<\/b>.", "t": "Darf die Pause aufgeteilt werden? → Ja: erst mindestens 15 Minuten, dann mindestens 30 Minuten, in dieser Reihenfolge. <i>Hinweis: Würde die Fähre nicht als Pause zählen, wäre die eine Stunde Fahrt nach Dover schon verbraucht und die Pause wäre um 11:30 Uhr fällig.<\/i>", "id": 55}, {"p": 3, "s": "Disposition, Maut und Auslandstransporte", "k": "f", "q": "Transport nach Bergamo (Italien), im Transit durch Österreich. Die Autobahnen dort sind mautpflichtig. Was müssen Sie veranlassen?", "a": "Das Fahrzeug braucht eine <b>GO-Box<\/b> (elektronisches Mautgerät) und muss bei der <b>ASFINAG<\/b>, dem österreichischen Autobahnbetreiber, angemeldet sein.", "t": "<i>Auf der Folie steht „Anmeldung über TOLL COLLECT bei ASFINAG“. Toll Collect ist der deutsche Mautbetreiber. In Österreich läuft die Lkw-Maut über die ASFINAG mit der GO-Box oder über einen europaweiten Mautanbieter (EETS-Box).<\/i>", "id": 56}, {"p": 3, "s": "Disposition, Maut und Auslandstransporte", "k": "o", "q": "Mit welchen zusätzlichen Kosten müssen Sie bei einem Transport nach Bergamo rechnen? Nenne mindestens zwei.", "a": "Autobahn- und Tunnelgebühren · Mautgebühren · Vergütung von Überstunden · Übernachtungskosten/Spesen · evtl. höhere Kraftstoffpreise", "t": "", "id": 57}, {"p": 3, "s": "Ladung und Überstand (§ 22 StVO)", "k": "f", "q": "Sie befördern mit Sattelzügen gelegentlich Verkaufsstände für Weinfeste, die 2 m nach hinten über die Ladefläche hinausragen, über eine Strecke von 50 km. Dürfen Sie das? Begründe.", "a": "<b>Ja.<\/b> Bei einer Wegstrecke von <b>höchstens 100 km<\/b> darf die Ladung bis zu <b>3 m<\/b> nach hinten über die Ladefläche hinausragen.", "t": "Und bei einer Fahrt über 300 km? → Dann nur bis 1,5 m nach hinten (§ 22 Abs. 4 StVO).", "id": 58}, {"p": 3, "s": "Ladung und Überstand (§ 22 StVO)", "k": "o", "q": "Wie muss nach hinten hinausragende Ladung nachts gekennzeichnet sein?", "a": "Mit einer <b>roten Leuchte<\/b> und einem <b>roten Rückstrahler<\/b>; der Rückstrahler darf höchstens <b>90 cm über der Fahrbahn<\/b> angebracht sein.", "t": "Und tagsüber? → Ragt die Ladung mehr als 1 m hinaus: hellrote Fahne (mind. 30 × 30 cm), ein gleich großes rotes Schild oder ein roter zylindrischer Körper. <i>(Laut Gesetz darf die rote Leuchte höchstens 1,50 m hoch sein, der Rückstrahler höchstens 90 cm.)<\/i>", "id": 59}, {"p": 3, "s": "Ladung und Überstand (§ 22 StVO)", "k": "o", "q": "Darf Ladung nach vorne über das Fahrzeug hinausragen?", "a": "Nach <b>§ 22 Abs. 3 StVO<\/b>: Bis zu einer Höhe von <b>2,50 m<\/b> darf die Ladung <b>nicht<\/b> nach vorne über das Fahrzeug (bei Zügen über das ziehende Fahrzeug) hinausragen. Darüber darf der Überstand nach vorne bis zu <b>50 cm<\/b> betragen.", "t": "", "id": 60}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "o", "q": "Nenne zwei Beispiele für Eintragungen im Gewerbezentralregister.", "a": "<b>Gewerbeuntersagungen<\/b>, Rücknahme von Erlaubnissen/Konzessionen, <b>Nichterteilung beantragter Erlaubnisse/Konzessionen<\/b>, <b>Verstöße gegen steuerrechtliche und sozialrechtliche Vorschriften<\/b> (Bußgeldentscheidungen).", "t": "<i>Die eigentliche Frage 6a war nicht auf den Fotos. Gemeint ist sehr wahrscheinlich das Gewerbezentralregister beim Bundesamt für Justiz; ein Auszug daraus gehört zum Nachweis der persönlichen Zuverlässigkeit.<\/i>", "id": 61}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "o", "q": "Wie lange müssen Tachographenschaublätter mindestens aufbewahrt werden? Unterscheide drei Fälle.", "a": "1. Nur als Nachweis der <b>Sozialvorschriften<\/b> (Lenk- und Ruhezeiten): <b>1 Jahr<\/b>.<br/>2. Zusätzlich als Nachweis der Arbeitszeit, die werktäglich über 8 Stunden hinausgeht: <b>2 Jahre<\/b> (§ 16 Abs. 2 ArbZG).<br/>3. Zusätzlich als <b>Ursprungsbeleg für die Lohnabrechnung<\/b>: <b>10 Jahre<\/b> (§ 147 AO, § 257 HGB).", "t": "", "id": 62}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "o", "q": "Nenne zwei Steuerarten, die Sie als Kosten verbuchen können.", "a": "<b>Kfz-Steuer<\/b> · <b>Grundsteuer<\/b> · Grunderwerbsteuer · Lohnsteuer bei Pauschalierung", "t": "Und die Einkommensteuer? → Nein, sie ist eine Personensteuer des Unternehmers und keine Betriebsausgabe.", "id": 63}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "o", "q": "Wie wirkt sich die Abschreibung in der Erfolgsrechnung (GuV) aus?", "a": "Sie <b>schmälert den Gewinn<\/b>, weil sie als Aufwand gebucht wird. Einnahmen und Umsatz ändern sich dadurch nicht.", "t": "Fließt dabei Geld ab? → Nein, Abschreibung ist ein Aufwand ohne Zahlung. Das Geld ist schon beim Kauf abgeflossen.", "id": 64}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "c", "q": "Jahresumsatz 180.000 €, durchschnittliche Geldeingangsdauer 2 Monate, Zinssatz 9 % pro Jahr (30 Tage/Monat, 360 Tage/Jahr). Wie viel Kapital ist durch die offenen Rechnungen gebunden, und welche jährlichen Zinskosten entstehen?", "a": "Gebundenes Umlaufvermögen = Jahresumsatz × Geldeingangsdauer in Tagen ÷ 360<br/>= 180.000 € × 60 ÷ 360 = <b>30.000 €<\/b><br/>Zinskosten = 30.000 € × 9 % = <b>2.700 € pro Jahr<\/b>", "t": "Wie senken Sie diese Kosten? → Kürzere Zahlungsziele, Skonto anbieten, konsequentes Mahnwesen.", "id": 65}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "c", "q": "Übungsvariante: Jahresumsatz 240.000 €, Geldeingangsdauer 45 Tage, Zinssatz 8 %. Wie hoch sind gebundenes Kapital und Zinskosten?", "a": "240.000 € × 45 ÷ 360 = <b>30.000 €<\/b> · 30.000 € × 8 % = <b>2.400 € pro Jahr<\/b>", "t": "", "id": 66}, {"p": 3, "s": "Register, Aufbewahrung, Steuern und Finanzen", "k": "o", "q": "Wodurch kann man Kredite sichern? Nenne fünf Möglichkeiten.", "a": "<b>Hypothek<\/b> · <b>Grundschuld<\/b> · <b>Bankbürgschaft<\/b> · <b>Abtretung von Forderungen<\/b> (Zession) · <b>Sicherungsübereignung<\/b> · <b>Eigentumsvorbehalt<\/b>", "t": "Was ist Sicherungsübereignung? → Die Bank wird Eigentümerin z. B. des Lkw, der Unternehmer bleibt Besitzer und darf ihn weiter nutzen.", "id": 67}, {"p": 3, "s": "Transportrecht, Versicherungen, Berufsgenossenschaft", "k": "o", "q": "Was versteht man im Transportrecht unter einer „reinen Quittung“?", "a": "Die <b>vorbehaltlose Empfangsbestätigung<\/b> des Empfängers gegenüber dem anliefernden Frachtführer. Zusammen mit der Annahme des Gutes führt sie grundsätzlich zum <b>Erlöschen aller Ansprüche<\/b> aus dem Beförderungsvertrag – außer bei einem <b>verdeckten Schaden<\/b>.", "t": "Was macht der Empfänger bei sichtbarem Schaden? → Er vermerkt den Schaden bei der Annahme schriftlich auf dem Frachtbrief bzw. Lieferschein (Vorbehalt).", "id": 68}, {"p": 3, "s": "Transportrecht, Versicherungen, Berufsgenossenschaft", "k": "o", "q": "Welche Versicherungen sind für einen Güterkraftverkehrsunternehmer gesetzlich vorgeschrieben: Kfz-Vollkasko, Kfz-Haftpflicht, Kfz-Teilkasko, Betriebshaftpflicht?", "a": "Nur die <b>Kfz-Haftpflichtversicherung<\/b> ist Pflicht. Voll- und Teilkasko sowie die Betriebshaftpflicht sind freiwillig.", "t": "<i>Zusätzlich verlangt § 7a GüKG für den gewerblichen Güterkraftverkehr eine Güterschaden-Haftpflichtversicherung. Stand sie nicht in der Auswahl, ist für diese Frage nur die Kfz-Haftpflicht anzukreuzen.<\/i>", "id": 69}, {"p": 3, "s": "Transportrecht, Versicherungen, Berufsgenossenschaft", "k": "o", "q": "Welche Möglichkeiten der Informationsbeschaffung hat ein Verkehrsunternehmer unter Marketinggesichtspunkten? Nenne jeweils zwei interne und externe Quellen.", "a": "<b>Interne Quellen:<\/b> Kostenrechnung · Kundenkartei · Umsatzstatistik · Auftragsstatistik · Berichte der Mitarbeiter über Kunden<br/><b>Externe Quellen:<\/b> Verbandsberichte · Geschäftsberichte · Wirtschaftszeitungen · Kammerzeitschriften", "t": "<i>Achtung: Auf der Folie heißen die internen Quellen „primär“ und die externen „sekundär“. Genau genommen sind auch interne Statistiken bereits vorhandene Daten, also Sekundärforschung. Für die Prüfung kannst du die Begriffe der Folie verwenden.<\/i>", "id": 70}, {"p": 3, "s": "Transportrecht, Versicherungen, Berufsgenossenschaft", "k": "o", "q": "Welche zwei Personenkreise sind grundsätzlich Pflichtversicherte bei der Berufsgenossenschaft Verkehr?", "a": "Die <b>Beschäftigten<\/b> und die <b>Unternehmer kraft Satzung<\/b> (Pflichtversicherung der Unternehmerinnen und Unternehmer nach der Satzung der BG Verkehr).", "t": "", "id": 71}, {"p": 3, "s": "Transportrecht, Versicherungen, Berufsgenossenschaft", "k": "o", "q": "Welche zwei Versicherungsfälle deckt die gesetzliche Unfallversicherung ab?", "a": "<b>Arbeitsunfälle<\/b> und <b>Berufskrankheiten<\/b> (§ 7 Abs. 1 SGB VII). Verbotswidriges Handeln schließt einen Versicherungsfall nicht aus (§ 7 Abs. 2).", "t": "Und der Unfall auf dem Weg zur Arbeit? → Der Wegeunfall gilt als Arbeitsunfall und ist mitversichert (§ 8 Abs. 2 SGB VII).", "id": 72}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "o", "q": "Was gilt für die Fahrtunterbrechung? Nenne Dauer, Aufteilung und was in der Pause erlaubt ist.", "a": "Nach spätestens <b>4,5 Stunden Lenkzeit<\/b> mindestens <b>45 Minuten<\/b> Pause. Teilbar in <b>höchstens 2 Abschnitte<\/b>: zuerst mindestens <b>15 Minuten<\/b>, dann mindestens <b>30 Minuten<\/b> – die <b>Reihenfolge ist zwingend<\/b>. Danach beginnt ein neuer Lenkzeitabschnitt.<br/>In der Pause <b>keine anderen Arbeiten<\/b>. Ausnahme: Wartezeit und Nicht-Lenkzeit in einem fahrenden Fahrzeug, auf einer <b>Fähre<\/b> oder im <b>Zug<\/b>.", "t": "Darf der Fahrer erst 30 und dann 15 Minuten Pause machen? → Nein, dann zählen die 15 Minuten nicht – es fehlt noch eine Pause von 30 Minuten.", "id": 73}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "c", "q": "Ein Fahrer fährt um 6:00 Uhr los, macht von 8:00 bis 8:15 Uhr eine Pause und fährt dann weiter. Bis wann muss er spätestens die zweite Pause einlegen, und wie lang muss sie sein?", "a": "Lenkzeit vor der ersten Pause: 2 Std. Rest bis 4,5 Std.: 2,5 Std. Ab 8:15 Uhr + 2:30 = <b>spätestens 10:45 Uhr<\/b>, Dauer mindestens <b>30 Minuten<\/b>.", "t": "", "id": 74}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "o", "q": "Welche Höchstmaße gelten für Lkw in der EU (Länge, Breite, Höhe)?", "a": "<b>Länge:<\/b> Einzelfahrzeug (Lkw) 12 m · Sattelkraftfahrzeug 16,5 m · Lastzug (Lkw mit Anhänger) 18,75 m<br/><b>Breite:<\/b> 2,55 m für alle Fahrzeuge (auch Anhänger und Sattelauflieger) · <b>2,60 m<\/b> bei Aufbauten von <b>klimatisierten<\/b> Fahrzeugen (z. B. Kühlkoffer)<br/><b>Höhe:<\/b> 4 m", "t": "", "id": 75}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "o", "q": "Welche zulässigen Gesamtgewichte und Achslasten gelten?", "a": "<b>Gesamtgewichte:<\/b> zweiachsiger Anhänger 18 t · dreiachsiger Anhänger 24 t (Folie: 25 t) · vierachsige Lastzüge/Sattelkraftfahrzeuge 36 t · Kombinationen mit <b>5 oder 6 Achsen 40 t<\/b> · <b>44 t<\/b> für dreiachsiges Kfz mit zwei- oder dreiachsigem Sattelanhänger, das im <b>kombinierten Verkehr<\/b> einen 40-Fuß-ISO-Container befördert.<br/><b>Achslasten:<\/b> Einzelachse ohne Antrieb 10 t · Antriebsachse 11,5 t", "t": "<i>In Deutschland ist für bestimmte Fahrzeuge zusätzlich der Lang-Lkw bis 25,25 m auf freigegebenen Strecken erlaubt – nur falls der Prüfer danach fragt.<\/i>", "id": 76}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "f", "q": "Ein Sattelzug mit 5 Achsen ist mit 41,5 t beladen. Darf er fahren? Und wenn er einen 40-Fuß-Container zum Bahnterminal bringt?", "a": "Normalerweise <b>nein<\/b>: Höchstgrenze 40 t, also 1,5 t überladen. Bringt er im <b>kombinierten Verkehr<\/b> einen 40-Fuß-ISO-Container zum Terminal (und hat die Zugmaschine drei Achsen), sind bis zu <b>44 t<\/b> erlaubt – dann <b>ja<\/b>.", "t": "", "id": 77}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "o", "q": "Wann und wie muss nach hinten hinausragende Ladung tagsüber gekennzeichnet werden?", "a": "Ragt die Ladung <b>mehr als 1 m<\/b> über die Rückstrahler hinaus, ist bei guter Sicht eine rote Kennzeichnung Pflicht: <b>rote Fahne 30 × 30 cm<\/b>, <b>rotes Schild 30 × 30 cm<\/b> oder ein <b>roter zylindrischer Körper<\/b> mit mindestens 35 cm Durchmesser.", "t": "Und nachts? → Rote Leuchte und roter Rückstrahler, Rückstrahler höchstens 90 cm über der Fahrbahn.", "id": 78}, {"p": 4, "s": "Lenkzeit, Maße, Gewichte und Ladung", "k": "o", "q": "Zählen Sie die Schritte beim Ankuppeln einer Sattelzugmaschine an den Auflieger in sinnvoller Reihenfolge auf (mindestens 8).", "a": "1. SZM langsam an den Auflieger heranfahren · 2. Höhe der Sattelplatte an den Auflieger anpassen · 3. Auflieger prüfen: Unterlegkeil? Bremse angezogen? · 4. <b>Keine Person zwischen den Fahrzeugen!<\/b> Langsam unterfahren, bis der Königszapfen einrastet · 5. Verschluss der Sattelkupplung kontrollieren, Sicherungshebel umlegen · 6. Versorgungsschläuche und Kabel verbinden · 7. Stützbeine hochfahren, Kurbel sichern · 8. Handbremse des Aufliegers lösen · 9. Unterlegkeil verstauen · 10. Luftfederung SZM auf Normalstellung · 11. Licht kontrollieren · 12. Luftdruck im Fahrerhaus kontrollieren · 13. Anfahr- und Bremsprobe · 14. Abfahrt", "t": "Merkhilfe: <b>Heranfahren – Prüfen – Kuppeln – Sichern – Verbinden – Stützen hoch – Bremse los – Kontrolle – Probe.<\/b> Die Folie sagt „Königsbolzen“; das Bauteil heißt richtig Königszapfen.", "id": 79}, {"p": 4, "s": "Arbeitsschutz und Berufsgenossenschaft", "k": "o", "q": "Unter welchen 4 Voraussetzungen darf ein Fahrer einen Gabelstapler führen?", "a": "1. <b>Mindestens 18 Jahre<\/b> alt · 2. für die Tätigkeit <b>geeignet und ausgebildet<\/b> · 3. <b>Befähigung nachgewiesen<\/b> (Staplerschein) · 4. vom Unternehmer <b>schriftlich beauftragt<\/b>. Zusätzlich: geräte- und betriebsbezogene Einweisung.", "t": "<i>Auf der Folie steht § 7 BGV D 27. Heute heißt die Vorschrift DGUV Vorschrift 68 „Flurförderzeuge“; der Inhalt ist gleich.<\/i>", "id": 80}, {"p": 4, "s": "Arbeitsschutz und Berufsgenossenschaft", "k": "o", "q": "In welcher Form ist die Unfallanzeige gegenüber der Berufsgenossenschaft abzugeben?", "a": "<b>Schriftlich<\/b> nach <b>vorgeschriebenem Muster<\/b> in <b>zweifacher Ausfertigung<\/b>.", "t": "Wann muss angezeigt werden? → Wenn ein Beschäftigter durch den Unfall mehr als 3 Tage arbeitsunfähig ist oder stirbt, innerhalb von 3 Tagen nach Kenntnis (§ 193 SGB VII). <i>Heute geht das meist auch online über das Portal der BG.<\/i>", "id": 81}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "o", "q": "Welche Regeln gelten laut Seminar für die Firmierung von Einzelkaufmann, OHG, KG und GmbH (Personenfirma)?", "a": "<b>Einzelkaufmann:<\/b> Familienname mit ausgeschriebenem Vornamen, Zusätze erlaubt.<br/><b>OHG:<\/b> Zunamen aller Teilhaber oder Name eines Teilhabers mit Zusatz, der das Gesellschaftsverhältnis andeutet.<br/><b>KG:<\/b> Name von mindestens einem Vollhafter mit Zusatz „KG“; Teilhafter dürfen nicht namentlich aufgenommen werden.<br/><b>GmbH als Personenfirma:<\/b> Name von wenigstens einem Gesellschafter mit Zusatz.", "t": "<i>Diese Regeln sind ein älterer Stand. Seit der Handelsrechtsreform 1998 sind auch Sach- und Fantasienamen erlaubt, z. B. „Blitz Logistik e. K.“. Für die Prüfung gilt der Seminarstoff.<\/i>", "id": 82}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "o", "q": "Nenne die wichtigsten Steuern des Unternehmers.", "a": "Einkommensteuer · Körperschaftsteuer (z. B. bei Kapitalgesellschaften) · Gewerbesteuer · Umsatzsteuer · Grundsteuer · Kfz-Steuer · Mineralölsteuer (seit 2006 <b>Energiesteuer<\/b>, eine indirekte Steuer).", "t": "", "id": 83}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "o", "q": "Was ist die Gewerbesteuer, wer erhält sie und wie wird sie berechnet?", "a": "Eine <b>ertragsabhängige<\/b> Steuer auf den <b>Gewerbeertrag<\/b>, die an die <b>Gemeinde<\/b> abgeführt wird. Berechnung über die <b>Steuermesszahl (3,5 %)<\/b> und den <b>Hebesatz<\/b>, den jede Gemeinde selbst festlegt (z. B. München 490 %, Pöcking 240 %, Langenwolschendorf 200 %, Bundesdurchschnitt laut Folie 437 %). Im Schnitt etwa <b>15 % des Gewinns<\/b>.", "t": "", "id": 84}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "c", "q": "Eine GmbH hat einen Gewerbeertrag von 100.000 €. Wie hoch ist die Gewerbesteuer a) beim Bundesdurchschnitt von 437 % und b) in Pöcking mit 240 %?", "a": "Steuermessbetrag: 100.000 € × 3,5 % = 3.500 €<br/>a) 3.500 € × 437 % = <b>15.295 €<\/b> (ca. 15 % – passt zur Faustregel)<br/>b) 3.500 € × 240 % = <b>8.400 €<\/b>", "t": "<i>Bei Einzelunternehmen und Personengesellschaften wird vorher ein Freibetrag von 24.500 € abgezogen.<\/i>", "id": 85}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "o", "q": "Nenne die vier Zweige der gesetzlichen Sozialversicherung, die Arbeitgeber und Arbeitnehmer gemeinsam tragen. Welche Beiträge zahlt nur der Arbeitgeber?", "a": "<b>Gemeinsam (grundsätzlich je zur Hälfte):<\/b> Krankenversicherung · Rentenversicherung · Pflegeversicherung · Arbeitslosenversicherung.<br/><b>Nur Arbeitgeber:<\/b> Insolvenzgeldumlage (U3) · U1 (Entgeltfortzahlung im Krankheitsfall) · U2 (Mutterschaftsaufwendungen) · <b>Berufsgenossenschaft<\/b> (Unfallversicherung, nach Gefahrklasse).", "t": "Beitragssätze laut Folie (Stand 2023): KV 14,6 % · RV 18,6 % · AV 2,6 % · PV 3,4 %. <i>Diese Werte werden fast jedes Jahr angepasst (z. B. PV und Zusatzbeiträge der Krankenkassen sind seitdem gestiegen). Für die Prüfung die Seminarwerte lernen, aber sagen können, dass sie sich ändern.<\/i>", "id": 86}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "o", "q": "Was ist der Unterschied zwischen Beitragsbemessungsgrenze und Versicherungspflichtgrenze?", "a": "<b>Beitragsbemessungsgrenze:<\/b> Bis zu diesem Einkommen werden Beiträge berechnet; Einkommen darüber bleibt beitragsfrei (laut Folie KV/PV 2023: 4.987,50 € monatlich; RV/AV 2025: 8.050 € monatlich).<br/><b>Versicherungspflichtgrenze:<\/b> Wer darüber verdient, darf die gesetzliche Krankenversicherung verlassen und in die <b>private<\/b> wechseln (laut Folie 2023: 66.600 € im Jahr).", "t": "<i>Beide Grenzen werden jährlich neu festgesetzt.<\/i>", "id": 87}, {"p": 4, "s": "Firmierung, Steuern und Sozialversicherung", "k": "o", "q": "Was regeln die Umlagen U1, U2 und U3, und wer muss sie zahlen?", "a": "<b>U1<\/b> – Lohnfortzahlung im Krankheitsfall: Pflicht nur für Unternehmen <b>bis 30 Mitarbeiter<\/b>.<br/><b>U2<\/b> – Mutterschaftsaufwendungen: Pflicht für <b>alle Betriebe<\/b>.<br/><b>U3<\/b> – Insolvenzgeldumlage: zahlen <b>alle insolvenzfähigen Arbeitgeber<\/b>, egal wie viele Mitarbeiter. Davon wird das Insolvenzgeld bezahlt, wenn ein Arbeitgeber pleite ist und kein Gehalt mehr zahlt. Sie wird von der <b>Krankenkasse<\/b> (Einzugsstelle) eingezogen und an die <b>Bundesagentur für Arbeit<\/b> weitergeleitet.", "t": "Alle drei Umlagen zahlt nur der Arbeitgeber. Die Höhe von U1 und U2 legt jede Krankenkasse selbst fest; der Satz der U3 wird jährlich festgesetzt (laut Folie gesetzlich 0,15 %, 2024 nur 0,06 %).", "id": 88}, {"p": 4, "s": "Arbeitsrecht und Marketing", "k": "o", "q": "Welche Voraussetzungen müssen für die Gründung eines Betriebsrats vorliegen? Wer ist wahlberechtigt, wer wählbar?", "a": "Nur 2 Voraussetzungen (§ 1 Abs. 1 BetrVG): ein <b>eigenständiger Betrieb<\/b> und in der Regel <b>mindestens 5 wahlberechtigte Arbeitnehmer, davon 3 wählbar<\/b>.<br/><b>Wählbar:<\/b> ab 18 Jahren und mindestens 6 Monate im Betrieb.<br/><b>Wahlberechtigt:<\/b> laut Folie ab 18 Jahren.", "t": "<i>Achtung: Seit 2021 sind Arbeitnehmer schon ab 16 Jahren wahlberechtigt (Betriebsrätemodernisierungsgesetz). Wählbar bleibt man ab 18. Im Zweifel beim Dozenten nachfragen.<\/i>", "id": 89}, {"p": 4, "s": "Arbeitsrecht und Marketing", "k": "o", "q": "Welche Unterlagen müssen Sie einem Arbeitnehmer bei Beendigung des Arbeitsverhältnisses übergeben? Nenne mindestens fünf.", "a": "Ausdruck der elektronischen <b>Lohnsteuerbescheinigung<\/b> · <b>Arbeitszeugnis<\/b> (auf Verlangen qualifiziert) · <b>Urlaubsbescheinigung<\/b> · <b>Arbeitsbescheinigung nach § 312 SGB III<\/b> (für die Arbeitsagentur) · bei Jugendlichen die Gesundheitsbescheinigungen · Erstbelehrung nach § 43 Infektionsschutzgesetz · Dokumente zur betrieblichen Altersversorgung · Arbeitsgenehmigung", "t": "Hat der Arbeitnehmer Anspruch auf seine ganze Personalakte? → Nein, aber er darf sie einsehen.", "id": 90}, {"p": 4, "s": "Arbeitsrecht und Marketing", "k": "o", "q": "Was versteht man unter einer Konkurrenzanalyse, und was wird beim Mitbewerber untersucht?", "a": "Die Erhebung und Analyse von <b>geschäftsrelevanten Informationen<\/b> über <b>direkte und indirekte Konkurrenten<\/b>. Ziel: <b>Stärken und Schwächen<\/b> der Konkurrenz gegenüber dem eigenen Unternehmen herausarbeiten, um <b>Wettbewerbsvorteile<\/b> zu finden, und daraus <b>Best Practices<\/b> für das eigene Unternehmen ableiten.<br/>Untersucht werden: Angebote und Preise · welche Kunden der Mitbewerber bedient · Art der Werbung · Ausstattung des Fuhrparks · Serviceleistungen.", "t": "", "id": 91}, {"p": 5, "s": "Haftung, Kalkulation und Finanzen", "k": "c", "q": "CMR-Transport: Von 33 Europaletten (16.500 kg) gehen 17 Paletten Sekt mit 8.500 kg Rohgewicht zu Bruch. Wert des Sekts: 48.960 €. 1 SZR = 1,20 €. Mit welchem Höchstbetrag haften Sie? Begründe.", "a": "Regelhaftung: 8.500 kg × 8,33 SZR = 70.805 SZR × 1,20 € = <b>84.966 €<\/b>.<br/>Gehaftet wird aber höchstens bis zum <b>Wert des Gutes<\/b>: <b>48.960 €<\/b>. Begründung: Bei Verlust oder Beschädigung wird maximal der Wert der beschädigten bzw. verlorenen Ware ersetzt (<b>Art. 23 Abs. 1 CMR<\/b>). Es gilt also immer der <b>niedrigere<\/b> der beiden Beträge.", "t": "Wie viel SZR pro kg gelten nach CMR und nach HGB? → In beiden Fällen 8,33 SZR je kg Rohgewicht (Art. 23 Abs. 3 CMR, § 431 HGB).", "id": 92}, {"p": 5, "s": "Haftung, Kalkulation und Finanzen", "k": "c", "q": "Übungsvariante: Bei einem CMR-Transport werden 2.000 kg Elektronik im Wert von 30.000 € beschädigt. 1 SZR = 1,20 €. Wie hoch ist Ihre Haftung?", "a": "2.000 kg × 8,33 SZR = 16.660 SZR × 1,20 € = <b>19.992 €<\/b>. Das ist weniger als der Warenwert von 30.000 €, also haften Sie nur mit <b>19.992 €<\/b>. Den Rest trägt der Absender bzw. seine Transportversicherung.", "t": "", "id": 93}, {"p": 5, "s": "Haftung, Kalkulation und Finanzen", "k": "f", "q": "Für eine Rückfahrt bietet Ihnen ein Auftraggeber nur 500 €. Eine andere Rückladung ist nicht in Sicht. Würden Sie den Auftrag aus Sicht der Deckungsbeitragsrechnung annehmen? Begründe.", "a": "<b>Ja.<\/b> Der Lkw muss ohnehin zurückfahren. Mit dem Auftrag wird wenigstens ein Teil der Kosten der Rückfahrt gedeckt, statt leer zu fahren. Stichwort: <b>Verlustminderung<\/b>.", "t": "Wann würden Sie ablehnen? → Wenn der Preis nicht einmal die zusätzlichen (variablen) Kosten des Auftrags deckt, z. B. Umweg, Wartezeit, Be- und Entladen.", "id": 94}, {"p": 5, "s": "Haftung, Kalkulation und Finanzen", "k": "o", "q": "Die finanzielle Leistungsfähigkeit für die Erlaubnis im Güterkraftverkehr kann außer durch Eigenkapital auch durch Reserven nachgewiesen werden. Nenne Beispiele.", "a": "<b>Stille Reserven<\/b> (Unterschied zwischen Buchwert und Verkehrswert des Anlagevermögens) · <b>Darlehen und Bürgschaften<\/b>, aber nur, wenn sie wie Eigenkapital zur Verfügung stehen · <b>Verkehrswert unbelasteter Vermögensgegenstände<\/b> im Privatvermögen der persönlich haftenden Unternehmer.", "t": "", "id": 95}, {"p": 5, "s": "Haftung, Kalkulation und Finanzen", "k": "o", "q": "Nenne mindestens drei bargeldlose Zahlungsarten.", "a": "Überweisung · Dauerauftrag · Lastschrift (Einzugsermächtigung) · Kreditkarte · Scheck · Wechsel", "t": "<i>Heute heißt die Einzugsermächtigung SEPA-Lastschrift; Scheck und Wechsel spielen in der Praxis kaum noch eine Rolle.<\/i>", "id": 96}, {"p": 5, "s": "Haftung, Kalkulation und Finanzen", "k": "o", "q": "Welche Angaben muss eine Rechnung bis 250 € brutto (Kleinbetragsrechnung) mindestens enthalten? Nenne fünf.", "a": "Vollständiger <b>Name und Anschrift<\/b> des leistenden Unternehmers · <b>Ausstellungsdatum<\/b> · <b>Menge und handelsübliche Bezeichnung<\/b> der Ware bzw. Art und Umfang der Leistung · <b>Bruttobetrag<\/b> in einer Summe · <b>Steuersatz<\/b>", "t": "", "id": 97}, {"p": 5, "s": "Verkehrsrecht und Transportrecht", "k": "o", "q": "Woran erkennt Ihr Fahrer auf der Autobahn, dass er den Mindestabstand einhält?", "a": "An den <b>Leitpfosten<\/b>: Sie stehen im Regelabstand von <b>50 m<\/b>. Der Mindestabstand für Lkw über 3,5 t bei mehr als 50 km/h beträgt ebenfalls 50 m.", "t": "Was gilt grundsätzlich als Faustregel für den Abstand? → „Halber Tacho“, also in Metern die Hälfte der gefahrenen Geschwindigkeit.", "id": 98}, {"p": 5, "s": "Verkehrsrecht und Transportrecht", "k": "o", "q": "Welche Höchstgeschwindigkeiten gelten in Deutschland für Sattelzüge?", "a": "Innerorts <b>50 km/h<\/b> · außerorts <b>60 km/h<\/b> · Autobahn <b>80 km/h<\/b>", "t": "<i>Gilt für Lkw bzw. Züge über 7,5 t zGG. Kraftfahrstraßen: wie außerorts.<\/i>", "id": 99}, {"p": 5, "s": "Verkehrsrecht und Transportrecht", "k": "o", "q": "Wo sind die Lenk- und Ruhezeiten geregelt?", "a": "Laut Folie: <b>VO (EWG) Nr. 3820/85<\/b>. Nicht im Güterkraftverkehrsgesetz, Arbeitszeitgesetz oder in der Gewerbeordnung.", "t": "<i>Achtung: Die VO 3820/85 wurde 2007 durch die <b>VO (EG) Nr. 561/2006<\/b> ersetzt. Das ist die heute gültige Antwort. Steht in einer Auswahlfrage nur die alte Verordnung, kreuze sie an; mündlich solltest du die 561/2006 nennen.<\/i>", "id": 100}, {"p": 5, "s": "Verkehrsrecht und Transportrecht", "k": "o", "q": "Die Ferienreiseverordnung verbietet Lkw über 7,5 t zGG auf bestimmten Autobahnen und Bundesstraßen den Verkehr. a) In welchen Monaten? b) An welchem Wochentag und zu welcher Uhrzeit?", "a": "a) <b>01.07. bis 31.08.<\/b> (Juli und August)<br/>b) <b>Samstags von 7:00 bis 20:00 Uhr<\/b>", "t": "Und sonntags? → Da gilt ohnehin das allgemeine Sonn- und Feiertagsfahrverbot von 0 bis 22 Uhr (§ 30 StVO).", "id": 101}, {"p": 5, "s": "Verkehrsrecht und Transportrecht", "k": "o", "q": "Innerhalb welcher Frist muss der Empfänger oder Absender eine Überschreitung der Lieferfrist anzeigen?", "a": "Innerhalb von <b>21 Tagen nach Ablieferung<\/b> (§ 438 HGB). Sonst erlischt der Anspruch.", "t": "<i>Zum Vergleich: Äußerlich erkennbare Schäden sind spätestens bei Ablieferung anzuzeigen, nicht erkennbare innerhalb von 7 Tagen.<\/i>", "id": 102}, {"p": 5, "s": "Gefahrgut", "k": "o", "q": "Was versteht man unter Gefahrgut?", "a": "Stoffe, von denen bei <b>unsachgemäßer Behandlung<\/b> Gefahren ausgehen können – für <b>Menschen, Tiere und die Umwelt<\/b>, ebenso für die <b>öffentliche Ordnung und Sicherheit<\/b>, die <b>Allgemeinheit<\/b> und <b>wichtige Gemeingüter<\/b>.", "t": "", "id": 103}, {"p": 5, "s": "Gefahrgut", "k": "o", "q": "In wie viele Klassen werden Gefahrgüter eingeteilt? Nenne sie.", "a": "<b>9 Gefahrgutklassen<\/b> (mit Unterklassen 13):<br/>1 Explosive Stoffe und Gegenstände · 2 Gase · 3 Entzündbare flüssige Stoffe · 4 Entzündbare feste Stoffe (4.1), selbstentzündliche Stoffe (4.2), Stoffe, die mit Wasser entzündbare Gase bilden (4.3) · 5 Entzündend (oxidierend) wirkende Stoffe (5.1), organische Peroxide (5.2) · 6 Giftige Stoffe (6.1), ansteckungsgefährliche Stoffe (6.2) · 7 Radioaktive Stoffe · 8 Ätzende Stoffe · 9 Verschiedene gefährliche Stoffe und Gegenstände", "t": "Zu welcher Klasse gehört Diesel? → Klasse 3, entzündbare flüssige Stoffe.", "id": 104}, {"p": 5, "s": "Gefahrgut", "k": "o", "q": "Nenne die 3 Bereiche, für die der Fahrer bei Gefahrguttransporten Schutzausrüstung mitführen muss, mit Beispielen.", "a": "<b>Schutz des eigenen Körpers:<\/b> Augenschutzbrille, Augenspülflasche, Atemschutz, Schutzhandschuhe, Schutzkleidung<br/><b>Ausrüstung am Fahrzeug:<\/b> z. B. Unterlegkeil, zwei selbststehende Warnzeichen, Warnweste, Handlampe, Feuerlöscher<br/><b>Schutz der Umwelt:<\/b> Kanalabdeckung, Bindemittel, Handfeger und Schaufel, Auffangbehälter für kleine Mengen austretender Flüssigkeit", "t": "<i>Die Fahrzeugausrüstung war auf dem Foto nicht lesbar; ich habe die übliche Ausrüstung nach ADR ergänzt.<\/i>", "id": 105}, {"p": 5, "s": "Marketing", "k": "o", "q": "Was versteht man unter dem Marketing-Mix, und woraus besteht er?", "a": "Alle <b>Entscheidungen und Handlungen<\/b>, die für eine erfolgreiche Platzierung von Unternehmen und Produkten am Markt wichtig sind – die einfachste und zugleich wirksamste Kombination von „Werkzeugen“ zur Umsetzung von Marketingplänen.<br/>Er besteht aus den <b>vier Ps<\/b>: <b>Produktpolitik<\/b> (Product) · <b>Preispolitik<\/b> (Price) · <b>Distributions-/Vertriebspolitik<\/b> (Place) · <b>Kommunikationspolitik<\/b> (Promotion).", "t": "", "id": 106}, {"p": 6, "s": "Verkehr, Ladung und Gewichte", "k": "o", "q": "Wie weit darf Ladung mit vorschriftsmäßiger Kennzeichnung nach hinten hinausragen, wenn es keine Entfernungsbeschränkung gibt?", "a": "Bis zu <b>1,5 m<\/b>. Bei einer Fahrt von höchstens <b>100 km<\/b> sind bis zu <b>3 m<\/b> erlaubt (§ 22 Abs. 4 StVO).", "t": "Ab wann muss gekennzeichnet werden? → Wenn die Ladung mehr als 1 m über die Rückstrahler hinausragt.", "id": 107}, {"p": 6, "s": "Verkehr, Ladung und Gewichte", "k": "o", "q": "Wie hoch darf das zulässige Gesamtgewicht von Anhängern mit mehr als 2 Achsen sein?", "a": "<b>24 t<\/b>. Zum Vergleich: zweiachsiger Anhänger 18 t.", "t": "<i>Achtung: Auf einer früheren Folie stand für dreiachsige Anhänger 25 t. Richtig nach StVZO und EU-Richtlinie ist 24 t, so steht es auch in der Lösung dieser Seminarfrage.<\/i>", "id": 108}, {"p": 6, "s": "Verkehr, Ladung und Gewichte", "k": "o", "q": "In welchen Fällen muss bzw. darf die Warnblinkanlage eingeschaltet werden? Nenne drei.", "a": "Zur <b>Absicherung eines liegengebliebenen Fahrzeugs<\/b> · beim <b>Abschleppen<\/b> · wenn andere Verkehrsteilnehmer <b>vor Gefahren gewarnt<\/b> werden sollen (z. B. Stauende) · wenn andere durch das <b>eigene Fahrzeug gefährdet<\/b> werden.", "t": "", "id": 109}, {"p": 6, "s": "Buchführung und Transportrecht", "k": "o", "q": "Bestandskonto oder Erfolgskonto? Forderungen aus Beförderungen · Kfz-Steuern · Kfz-Versicherung · Guthaben auf dem Bankkonto", "a": "Forderungen aus Beförderungen → <b>Bestandskonto<\/b> · Kfz-Steuern → <b>Erfolgskonto<\/b> · Kfz-Versicherung → <b>Erfolgskonto<\/b> · Bankguthaben → <b>Bestandskonto<\/b>.<br/>Bestandskonten werden über die <b>Bilanz<\/b> abgeschlossen, Erfolgskonten (Aufwand und Ertrag) über die <b>Gewinn- und Verlustrechnung<\/b>.", "t": "Merkhilfe: Was man besitzt oder schuldet = Bestand. Was Geld kostet oder einbringt = Erfolg.", "id": 110}, {"p": 6, "s": "Buchführung und Transportrecht", "k": "o", "q": "Welche Möglichkeit hat der Frachtführer nach HGB, seine Rechte unmittelbar am Beförderungsgut zu sichern, wenn der Auftraggeber nicht zahlt?", "a": "Ein <b>Pfandrecht<\/b> (bzw. Zurückbehaltungsrecht) am beförderten Gut nach <b>§ 441 HGB<\/b>. Er kann die Ware also zurückhalten, bis seine Forderungen aus dem Frachtvertrag bezahlt sind.", "t": "", "id": 111}, {"p": 6, "s": "Umweltschutz", "k": "o", "q": "Nenne vier besonders zu entsorgende Abfälle, die in einem Güterkraftverkehrsunternehmen entstehen können.", "a": "Öle (Altöl) · Batterien bzw. Batteriesäure · Lacke · Altreifen · Kühlerflüssigkeit · Kaltreiniger · Lösungsmittelgemische", "t": "", "id": 112}];

const KEY="gk-lernkarten-v1";
let st={known:{},again:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.known)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let part="all",deck=[],pos=0,shown=false,session={good:0,again:0};
const $=id=>document.getElementById(id);
const KIND={c:"Rechnen",f:"Fallfrage",o:""};
function inPart(x){return part==="all"||x.p==part}
function build(){
  const m=$("mode").value;
  deck=Q.filter(inPart).filter(x=>m==="all"?true:m==="again"?st.again[x.id]:!st.known[x.id]);
  if($("shuffle").checked){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
  pos=0;shown=false;session={good:0,again:0};render();
}
function stats(){
  const pool=Q.filter(inPart),k=pool.filter(x=>st.known[x.id]).length,a=pool.filter(x=>st.again[x.id]&&!st.known[x.id]).length,r=pool.length-k-a;
  $("stats").innerHTML=`<span><i class="dot" style="background:var(--good)"></i><b>${k}</b> sicher</span><span><i class="dot" style="background:var(--again)"></i><b>${a}</b> nochmal</span><span><i class="dot" style="background:var(--line)"></i><b>${r}</b> offen</span>`;
  const w=n=>(pool.length?n/pool.length*100:0)+"%";
  $("bar").innerHTML=`<i style="width:${w(k)};background:var(--good)"></i><i style="width:${w(a)};background:var(--again)"></i>`;
}
function chips(){
  const opts=[["all","Alle"],...[1,2,3,4,5,6].map(n=>[String(n),"Teil "+n])];
  $("parts").innerHTML=opts.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${part===v}">${l}</button>`).join("");
  $("parts").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{part=b.dataset.v;chips();build()});
}
function render(){
  stats();
  const stage=$("stage"),dock=$("dock");
  if(pos>=deck.length){
    const none=deck.length===0;
    stage.innerHTML=`<section class="card done"><h2>${none?"Hier ist nichts mehr offen":"Runde geschafft"}</h2>
      ${none?`<p>In dieser Auswahl gibt es keine Karten. Wähle „Alle Karten“ oder einen anderen Teil.</p>`:
      `<div class="big">${session.good} / ${session.good+session.again}</div><p>Karten sicher beantwortet. ${session.again?`${session.again} kommen bei „Nochmal“ wieder.`:""}</p>`}
    </section>`;
    dock.innerHTML=`<button class="btn reveal" id="restart">Neue Runde</button><button class="btn ghost" id="reset">Fortschritt löschen</button>`;
    $("restart").onclick=build;
    $("reset").onclick=()=>{const b=$("reset");if(b.dataset.c){st={known:{},again:{}};save();build()}else{b.dataset.c=1;b.textContent="Wirklich löschen?"}};
    return;
  }
  const x=deck[pos],kind=KIND[x.k];
  stage.innerHTML=`<article class="card">
    <div class="meta"><span>Teil ${x.p} · ${x.s}</span><span>${kind?`<span class="kind">${kind}</span> · `:""}${pos+1} / ${deck.length}</span></div>
    <p class="q">${x.q}</p>
    ${shown?`<div class="ans"><p class="a">${x.a}</p>${x.t?`<p class="t">${x.t}</p>`:""}</div>`:""}
  </article>`;
  dock.innerHTML=shown?`<button class="btn again" id="again">Nochmal</button><button class="btn good" id="good">Konnte ich</button>`
                      :`<button class="btn reveal" id="show">Antwort zeigen</button>`;
  if(shown){$("good").onclick=()=>rate(true);$("again").onclick=()=>rate(false)}else{$("show").onclick=reveal}
}
function reveal(){shown=true;render()}
function rate(ok){
  const x=deck[pos];
  if(ok){st.known[x.id]=1;delete st.again[x.id];session.good++}else{st.again[x.id]=1;delete st.known[x.id];session.again++}
  save();pos++;shown=false;render();window.scrollTo({top:0});
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(pos>=deck.length)return;
  if(e.code==="Space"&&!shown){e.preventDefault();reveal()}
  else if(shown&&e.key==="1")rate(true);
  else if(shown&&e.key==="2")rate(false);
});
$("mode").onchange=build;$("shuffle").onchange=build;
chips();build();
</script>
